{{- $image := .Get "image" -}}
{{- $embed := .Get "embed" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $flip := .Get "flip" -}}
{{- $invert := .Get "invert" -}}
<section class="media-text{{ with $flip }} media-text--flip{{ end }}">
  <figure class="media-text__image media-motif{{ with $invert }} media-motif--flip{{ end }}">
    {{- with $embed }}
    <iframe
      src="{{ . }}"
      title="Térkép – Aiki Dent Fogászat"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allowfullscreen
    ></iframe>
    {{- else }}
    <img src="{{ $image }}" alt="{{ $alt }}">
    {{- end }}
  </figure>

  <div class="media-text__content">
    {{ .Inner | markdownify }}
  </div>
</section>
