<nav class="nav-wrapper" aria-label="Fő navigáció">
  <button
    class="nav-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="main-menu"
    aria-label="Menü megnyitása"
  >
    <span class="hamburger" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </span>
  </button>

  <ul class="menu-list" id="main-menu">
    {{ range .Site.Menus.main }}
      <li>
        <a
          href="{{ .URL }}"
          {{ if eq .URL $.RelPermalink }}aria-current="page"{{ end }}
        >
          {{ .Name }}
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
