baseURL = 'https://aikident.hu/'
languageCode = 'hu-HU'
defaultContentLanguage = 'hu'
title = 'Aiki Dent Fogászat'
enableRobotsTXT = true
enableGitInfo = false
# a rebuild must never leave pages from a previous build behind
cleanDestinationDir = true
disableKinds = ['taxonomy', 'term', 'rss']

[params]
  # „fogszabályozó" korábban itt szerepelt — a briefben nincs ilyen végzettség, ezért
  # kivettük. A meta leírás csak azt állítja, ami a megbízó anyagában szerepel.
  description = 'Biológiai és holisztikus fogászat Budapesten. Dr. Kelemen László fogorvos rendelője a XIII. kerületben.'
  brandName = 'Aiki Dent Fogászat'
  tagline = 'Biológiai és holisztikus fogászat'
  phoneDisplay = '+36 30 193 2714'
  phoneHref = '+36301932714'
  email = 'info@aikident.hu'
  street = 'Hegedűs Gyula utca 29/b'
  city = '1136 Budapest'
  hours = 'Előzetes egyeztetés alapján'
  mapsUrl = 'https://www.google.com/maps/search/?api=1&query=Heged%C5%B1s+Gyula+utca+29%2Fb%2C+1136+Budapest'

[params.theme]
  wine = '#811331'
  mint = '#7eecc3'

