# Gyakori kérdések — az Új páciensek és a Szolgáltatások oldalon.
items:
  - q: Mi az a holisztikus vagy biológiai fogászat?
    a: >-
      A holisztikus fogászat — amelyet néha biológiai vagy integratív fogászatnak is
      neveznek — a szájüregi egészség és a teljes test egészségi állapota közötti
      összefüggésekre összpontosít. Figyelembe veszi, hogy a fogászati anyagok, a
      kezelések, sőt a szájüregi fertőzések is milyen hatással lehetnek a szervezet
      egészére. Ahelyett, hogy „egységes” megközelítést alkalmaznánk, gondosan
      személyre szabjuk a kezeléseket: nem mérgező, biokompatibilis anyagokat és
      minimálisan invazív technikákat használunk, amelyek összhangban állnak a
      szervezet természetes gyógyulási képességeivel.

  - q: Miért fontos a holisztikus szemlélet?
    a: >-
      A száj a szervezet kapuja. A kutatások folyamatosan bizonyítják a szájápolás és
      olyan betegségek közötti összefüggéseket, mint a szívbetegségek, a cukorbetegség,
      az autoimmun rendellenességek, sőt a kognitív egészség is. A szájban található
      mérgező anyagok, a krónikus gyulladások vagy a rejtett fertőzések idővel
      észrevétlenül ronthatják az általános egészségi állapotot.

  - q: Miben más a kezelés az Aiki Dent Fogászatban?
    a: >-
      Nálunk a kezelés az egész emberre irányul. Biológiailag kompatibilis anyagokat
      választunk (higany-, BPA- és fluoridmentes megoldások), minimálisan invazív
      technikákkal dolgozunk, és minden ajánlásunknál figyelembe vesszük az Ön
      általános állapotát. Az oktatás, a táplálkozás és az életmód támogatása minden
      látogatás része.

  - q: Milyen anyagokat használnak?
    a: >-
      Kerüljük az olyan anyagokat, mint a higany, a BPA és a fluorid, és helyettük
      biztonságosabb alternatívákat alkalmazunk, amelyek támogatják szervezete
      hosszú távú egészségét. Töméseink 100%-ban BPA-mentesek, a pótlások fémmentesek.

  - q: Elfogadnak fogászati biztosítást?
    a: >-
      Fogászati biztosítást nem fogadunk el fizetési módként; a díjakat a
      szolgáltatások igénybevételekor közvetlenül a páciens fizeti meg rendelőnkben.
      Szolgáltatásként azonban számlát állítunk ki a fogászati biztosítóknak, így
      pácienseink közvetlenül a saját biztosítójuktól kaphatják meg a visszatérítést.
      Számos egészségpénztárral állunk szerződésben.

  - q: Mennyibe kerül egy első konzultáció?
    a: >-
      A kezelés költsége az Ön egyéni igényeitől és a kezelési tervétől függően
      változhat. A rendelőnkben tett látogatása során megbeszéljük Önnel a kezelés
      költségét, valamint az elérhető fizetési lehetőségeket, hogy Ön a legjobb
      döntést hozhassa meg.

  - q: Mit hozzak magammal az első vizitre?
    a: >-
      Kérjük, töltse ki és hozza magával az Új páciens adatlapot, valamint a korábbi
      röntgen- és leletanyagait, ha rendelkezésre állnak. Ha rendszeresen szed
      gyógyszert vagy van ismert allergiája, azt is jelezze előre.
