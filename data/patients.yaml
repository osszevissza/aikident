# Új páciensek — első látogatás, adatlap, pénzügyek, kinek szól.
intro: >-
  Gondozási filozófiánk minden tevékenységünket áthatja. Az Ön általános jóléte és
  egészsége a legfontosabb számunkra. Tudatában vagyunk annak, hogy minden páciens
  egyedi, és célunk az, hogy segítsünk Önnek megőrizni fogait funkcionálisan,
  kényelmesen és esztétikailag egy életen át.

steps:
  - title: Adatlap kitöltése
    text: >-
      Töltse le az Új páciens adatlapot, töltse ki otthon nyugodtan, és hozza
      magával az első vizit alkalmával.
  - title: Ismerkedés és meghallgatás
    text: >-
      Első látogatásakor időt szánunk arra, hogy megismerjük Önt (és Ön is minket),
      valamint megbeszéljük fogászati igényeit.
  - title: Átfogó vizsgálat
    text: >-
      Átfogó fogászati vizsgálatot végzünk, és szükség esetén elkészítjük a
      röntgenfelvételeket.
  - title: Személyre szabott terv
    text: >-
      Összegyűjtjük az információkat, majd közösen áttekintjük a személyre szabott
      kezelési tervet és a költségeket.

we_do:
  - Átfogó fogászati vizsgálat elvégzése
  - Szükséges röntgenfelvételek elkészítése
  - Információk gyűjtése az Ön számára személyre szabott terv elkészítéséhez
  - A leletek közös áttekintése és érthető magyarázata

bring:
  - Új páciens adatlap (kitöltve)
  - Korábbi röntgen- és leletanyagok
  - A jelenleg szedett gyógyszerek listája
  - Ismert allergiák, érzékenységek

# Kinek szól — és kinek nem. Csak olyan pontok kerüljenek ide, amelyeket a
# megbízó briefje vagy a rendelő gyakorlata alátámaszt. Nem általános
# marketingállítások: a „nem neki való” lista éppúgy a tájékoztatás része.
fits:
  - icon: shield
    label: Szeretné elkerülni a higanyt, a BPA-t és a fluoridot
    text: >-
      A töméseink BPA-mentesek, a pótlások fémmentesek, a fogtisztításnál pedig —
      ahol lehetséges — kíméletes, természetes termékeket használunk.
  - icon: scan
    label: Fontos, hogy a kezelés előtt teljes körű diagnózis készüljön
    text: >-
      Nem találgatunk: állapotfelmérés, szükség esetén digitális röntgenfelvétel
      vagy 3D-s CBCT, és csak ezután kezelési terv.
  - icon: leaf
    label: Olyan tünetekre keres választ, amelyek a szájüregből indulhatnak ki
    text: >-
      A holisztikus szemlélet lényege, hogy a szájüregi gócokat és a szervezet
      egészének állapotát együtt vizsgáljuk.
  - icon: users
    label: Szeretné érthetően megérteni, mi történik a szájában
    text: >-
      A leleteket és a kezelési tervet közösen, érthetően áttekintjük, hogy Ön is
      megalapozott döntést hozhasson.
  - icon: heart-pulse
    label: Nyitott a megelőzésre és az életmódra is
    text: >-
      Az oktatás, a táplálkozás és az életmód támogatása minden látogatás részét
      képezi.

notfits:
  - icon: clock
    label: Akut fogfájással azonnal szeretne ellátást kapni
    text: >-
      Rendelésünk előzetes egyeztetés alapján működik, ezért ilyen esetben hívjon
      minket telefonon — megnézzük, mikor tudjuk fogadni.
  - icon: book
    label: Azt várja, hogy a fogászati biztosítója fizeti a kezelést
    text: >-
      A biztosítást fizetési módként nem fogadjuk el: a díjat a rendelőben kell
      megfizetni, a visszatérítést pedig a saját biztosítójától kaphatja meg.
  - icon: info
    label: Csak a gyors, diagnosztika nélküli megoldást keresi
    text: >-
      A kezelést nálunk mindig állapotfelmérés előzi meg: a pontos kép ismerete
      nélkül nem tervezünk beavatkozást.
  - icon: hand-heart
    label: Nem szeretne részt venni a döntésekben
    text: >-
      A kezelési tervet közösen beszéljük át — a döntés minden esetben az Öné.

finance:
  title: Hogyan alakul a kezelés ára?
  paragraphs:
    - >-
      A kezelés költsége az Ön egyéni igényeitől és a kezelési tervtől függően
      változhat.
    - >-
      Az első látogatáson megbeszéljük Önnel a kezelés költségét, valamint az
      elérhető fizetési lehetőségeket, hogy Ön a legjobb döntést hozhassa meg.
    - >-
      Árlista egyelőre nem szerepel a honlapon: a pontos összeg a kezelési tervhez
      kötődik, ezért azt személyesen egyeztetjük. Ha előzetes tájékoztatást szeretne,
      hívjon minket a +36 30 193 2714 számon.
