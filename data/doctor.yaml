# Dr. Kelemen László — bemutatkozás.
name: Dr. Kelemen László
role: Fogorvos, a rendelő alapítója és tulajdonosa
photo: /img/demo1.webp
lead: >-
  A holisztikus és biológiai fogászat képezi a rendelőnk alapját. Dr. Kelemen László
  a fogorvos és tulajdonos.

letter:
  greeting: Kedves Páciensek és Barátok!
  paragraphs:
    - >-
      Melegszívűsége, lelkesedése és gondoskodó természete tökéletesen illeszkedik
      ahhoz a filozófiához, amelyet Önök már megismertek és amelyben megbíznak.
      Biztos vagyok benne, hogy barátságosnak, együttérzőnek és elkötelezettnek
      fogják találni őt mind fogászati egészségük, mind általános jólétük iránt.
    - >-
      Az integrált orvoslás szemléletének és módszereinek tanulmányozásával
      foglalkozom, és folyamatosan képzem magam — hogy Önnek a lehető legszélesebb
      rálátást nyújthassam az egészségére.

credentials:
  - title: Fogorvosi diploma
    icon: award
    text: A Semmelweis Egyetem (SOTE) Fogorvostudományi Karán szerzett diplomát.

  - title: Biológiai fogászat
    icon: leaf
    text: >-
      A magyarországi biológiai fogászat vezető szakértőitől tanult, többek között
      Dr. Csiszár Róberttől.

  - title: Szakmai tagságok
    icon: users
    text: >-
      Az amerikai IAOMT (International Academy of Oral Medicine and Toxicology),
      valamint az új MOK (vezető: dr. Tamasi József) tagja.

  - title: Hagyományos kínai orvosi diploma
    icon: needle
    text: >-
      Dr. Eőry Ajándok által vezetett budapesti Kínai Klinikán hagyományos kínai
      orvosi diplomát kapott. Mesterei kínai professzorok voltak, valamint a
      világhírű Pálos István professzor.

  - title: Természetgyógyászat és akupunktúra
    icon: hand-heart
    text: >-
      Természetgyógyászati végzettsége is van. Akupunktúrás szakvizsgát is tett a
      HIETE-n (Haynal Imre Egészségtudományi Egyetem).

  - title: Lézerterápia és fülakupunktúra
    icon: zap
    text: >-
      Lézerterapeuta, valamint a fülakupunktőri szakképzettséggel is rendelkezik.
